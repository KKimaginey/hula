<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hula Academy 44 Mana Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* --- 기본 테마 설정 --- */
        :root {
            --color-header: #EF6356;
            --color-orange: #F49E4C;
            --color-teal-dark: #168087;
            --color-teal-light: #2CBEB0;
            --color-green: #70A557;
            --bg-color: #F8F5E8;
            --text-dark: #333333;
            --text-white: #FFFFFF;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        /* --- 헤더 및 그리드 스타일 --- */
        .header-banner {
            background-color: var(--color-header);
            color: var(--text-white);
            padding: 20px;
            border-radius: 0 0 25px 25px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(239, 99, 86, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-banner h1 { margin: 0; font-size: 24px; font-weight: 700; }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .card {
            border-radius: 20px;
            padding: 20px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            color: white;
        }
        .card .material-icons { font-size: 50px; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
        .card p { margin: 5px 0 0 0; font-size: 11px; opacity: 0.9; }

        .bg-orange { background-color: var(--color-orange); }
        .bg-teal-dark { background-color: var(--color-teal-dark); }
        .bg-teal-light { background-color: var(--color-teal-light); }
        .bg-green { background-color: var(--color-green); }

        .small-cards-wrapper { display: flex; gap: 15px; }
        .small-card { flex: 1; height: 150px; border-radius: 20px; background-color: var(--color-teal-dark); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .small-card h3 { font-size: 13px; margin: 0; }

        /* --- 상세 페이지 (Detail View) --- */
        .detail-page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .detail-header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #555; margin-right: 10px; }
        .detail-title { font-size: 22px; font-weight: bold; color: var(--color-teal-dark); }
        
        .content-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); line-height: 1.6; }
        .content-box h3 { color: var(--color-orange); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 20px; }
        
        /* 카드 뽑기 스타일 */
        .card-game-box { text-align: center; padding: 20px; }
        .game-card { width: 150px; height: 220px; background: var(--color-teal-dark); border-radius: 10px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; cursor: pointer; transition: transform 0.5s; backface-visibility: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .game-result { min-height: 70px; padding: 10px; background: #FFF3E0; border-radius: 10px; border: 1px dashed var(--color-orange); }
        .card-name { font-size: 20px; font-weight: bold; color: var(--color-header); margin-bottom: 5px; }
        
        /* 44장 카드 목록 상세 스타일 */
        .card-list-44 { padding-left: 40px; }
        .card-list-44 li { 
            margin-bottom: 10px; 
            padding: 8px 0; 
            border-bottom: 1px dotted #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .card-list-44 strong { color: var(--color-teal-dark); font-size: 16px; }
        .card-list-44 span { font-size: 13px; color: #666; margin-top: 3px; }

        /* 링크 관리 스타일 */
        .input-group { display: flex; gap: 8px; margin-top: 15px; }
        .input-group input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .input-group button { background: var(--color-teal-dark); color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; }
        .link-item { display: flex; justify-content: space-between; padding: 10px; background: #f9f9f9; margin-top: 8px; border-radius: 8px; align-items: center; }
        .link-item a { color: var(--color-teal-dark); text-decoration: none; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        
        /* --- 모달 및 하단 네비게이션 --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 15% auto; padding: 24px; border-radius: 20px; width: 85%; max-width: 400px; }
        .close-button { float: right; font-size: 28px; cursor: pointer; color: #aaa; }
        .lyrics-box { background: #f5f5f5; padding: 15px; border-radius: 10px; white-space: pre-wrap; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        .lyrics-box h4 { color: var(--color-teal-dark); margin: 5px 0 5px 0; font-size: 15px; }
        .lyrics-box p { margin: 0 0 10px 0; }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: white; border-radius: 30px; padding: 10px 20px; display: flex; justify-content: space-between; box-shadow: 0 5px 20px rgba(0,0,0,0.1); z-index: 100; }
        .nav-btn { background: none; border: none; color: #999; display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-banner">
        <span class="material-icons">local_florist</span>
        <h1>Hula Academy</h1>
    </div>

    <div id="homeView" class="grid-container">
        <div class="card bg-orange" onclick="openDetail('history')">
            <span class="material-icons">people_alt</span>
            <h3>Hula History</h3>
            <p>역사와 기원</p>
        </div>

        <div class="card bg-teal-dark" onclick="openDetail('lessons')">
            <span class="material-icons">directions_run</span>
            <h3>Dance Lessons</h3>
            <p>기초 동작 배우기</p>
        </div>

        <div class="card bg-teal-light" onclick="openDetail('mele')">
            <span class="material-icons">music_note</span>
            <h3>Mele Songs</h3>
            <p>노래와 가사 해석</p>
        </div>

        <div class="card bg-orange" onclick="openDetail('costumes')">
            <span class="material-icons">checkroom</span>
            <h3>Costumes</h3>
            <p>의상 정보 & 링크</p>
        </div>

        <div class="card bg-green" onclick="openDetail('spirit')">
            <span class="material-icons">spa</span>
            <h3>Hawaiian Spirit</h3>
            <p>알로하 정신</p>
        </div>

        <div class="small-cards-wrapper">
            <div class="small-card" onclick="openDetail('cards')">
                <span class="material-icons">style</span>
                <h3>Mana Card<br>44 Pick</h3>
            </div>
            <div class="small-card" onclick="window.open('https://www.youtube.com/results?search_query=hula+dance+lesson', '_blank')">
                <span class="material-icons">play_circle_filled</span>
                <h3>YouTube<br>Class</h3>
            </div>
        </div>
    </div>

    <div id="detailView" class="detail-page">
        <div class="detail-header">
            <button class="back-btn" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </button>
            <span id="detailTitle" class="detail-title">Title</span>
        </div>
        <div id="detailContent" class="content-box">
            </div>
    </div>

    <div id="meleModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeMeleModal()">&times;</span>
            <h2 id="modalSongTitle" style="color:var(--color-teal-dark); margin:0;"></h2>
            <p id="modalSongSub" style="color:#666; font-size:14px; margin-top:5px;"></p>
            <div id="modalLyrics" class="lyrics-box"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="goHome()">
            <span class="material-icons">home</span>Home
        </button>
        <button class="nav-btn" onclick="openDetail('lessons')">
            <span class="material-icons">school</span>Learn
        </button>
        <button class="nav-btn" onclick="openDetail('costumes')">
            <span class="material-icons">shopping_bag</span>Shop
        </button>
    </div>

    <script>
        // --- 0. 마나 카드 데이터베이스 (44장 전체) ---
        const manaCardsData = [
            { name: "ʻIʻo", meaning: "신비 (Mystery)", message: "지금은 알 수 없는 것들을 포용하고, 대답을 찾으려 하기보다 흐름을 믿어야 할 때입니다." },
            { name: "Po/Ao", meaning: "무의식/의식 (Unconscious/Conscious)", message: "내면의 목소리와 꿈의 메시지에 귀 기울이세요. 의식과 무의식의 균형이 필요합니다." },
            { name: "Tapa", meaning: "결합 (Union)", message: "두 개의 다른 요소가 하나로 합쳐져 새로운 힘을 만들고 있습니다. 파트너십에 집중하세요." },
            { name: "Mana", meaning: "역량 강화 (Empowerment)", message: "당신 안의 신성한 힘(Mana)을 발휘하세요. 주저하지 말고 당신의 능력을 세상에 보여줄 때입니다." },
            { name: "Ku/Hina", meaning: "혼란/치유 (Conflict/Healing)", message: "현재 갈등 상황이 치유와 성장의 기회임을 기억하세요. 싸움 대신 해결책을 찾으세요." },
            { name: "Hiʻiaka i ka poli o Pele", meaning: "헌신 (Devotion)", message: "당신의 목표나 사랑하는 사람에게 흔들림 없는 헌신을 보여주세요. 믿음이 기적을 만듭니다." },
            { name: "Huna", meaning: "비밀들 (Secrets)", message: "숨겨진 진실이나 정보를 발견하게 될 수 있습니다. 모든 것을 밝히기 전에 신중하게 다루세요." },
            { name: "Lono/Kamapuaʻa", meaning: "추수/비옥함 (Harvest/Fertility)", message: "당신이 노력한 결실을 거둘 때입니다. 새로운 아이디어나 프로젝트를 시작하기에 비옥한 시기입니다." },
            { name: "Mano", meaning: "리더십/욕망 (Leadership/Lust)", message: "당신의 타고난 리더십을 발휘하고, 열정적인 욕망을 창조적인 에너지로 전환하세요." },
            { name: "Lāʻamaomao", meaning: "속죄 (Atonement)", message: "과거의 잘못이나 실수를 인정하고 용서를 구하세요. 내면의 평화를 위한 화해의 시간이 필요합니다." },
            { name: "Ka wai a ka pīʻilikō", meaning: "투영 (Reflection)", message: "주변 환경이 당신의 내면 상태를 반영합니다. 외부가 아닌 내면을 들여다보세요." },
            { name: "Kanaloa", meaning: "토대 (Foundation)", message: "당신의 삶의 기반과 토대를 점검하세요. 견고한 기초 위에 더 큰 성장을 이룰 수 있습니다." },
            { name: "Pahu", meaning: "적절한 때/의례 (Timing/Ritual)", message: "모든 일에는 적절한 때가 있습니다. 현재 상황에 맞는 의식이나 계획을 세우는 것이 중요합니다." },
            { name: "Aloha", meaning: "사랑 (Love)", message: "가장 기본적인 하와이 정신. 모든 행동과 생각에 사랑과 자비를 담으세요. 사랑은 치유의 힘입니다." },
            { name: "ʻAwa", meaning: "제공/희생 (Offering/Sacrifice)", message: "당신의 목표를 위해 기꺼이 희생하거나 내어줄 것이 있는지 생각하세요. 진정한 헌신이 필요합니다." },
            { name: "Menehune", meaning: "인내 (Persistence)", message: "작고 꾸준한 노력이 큰 결과를 만듭니다. 지치지 않고 목표를 향해 인내심을 가지세요." },
            { name: "Tī", meaning: "정화 (Purification)", message: "부정적인 에너지나 관계를 정리할 때입니다. 몸과 마음을 정화하고 깨끗한 상태를 만드세요." },
            { name: "Pueo", meaning: "수호자 (Guidance)", message: "당신에게 필요한 조언이나 지혜가 곧 찾아옵니다. 주변의 신호와 멘토의 말을 주의 깊게 들으세요." },
            { name: "ʻŌle", meaning: "이야기들 (Stories)", message: "당신이 자신에게 들려주는 이야기가 현실을 만듭니다. 부정적인 자기 대화를 긍정적인 이야기로 바꾸세요." },
            { name: "Iwi", meaning: "존경 (Respect)", message: "조상, 연장자, 그리고 모든 생명체에 대한 존경심을 표현하세요. 존중은 관계의 근간입니다." },
            { name: "Lāmakū", meaning: "승리 (Victory)", message: "당신의 노력과 싸움이 곧 승리로 끝날 것입니다. 자신감을 가지고 마지막까지 나아가세요." },
            { name: "Pele", meaning: "대변동 (Upheaval)", message: "강렬한 변화와 격변의 시기입니다. 낡은 것은 불태워지고 새로운 것이 창조될 것입니다." },
            { name: "Laka", meaning: "영감 (Inspiration)", message: "당신의 창의성과 영감이 최고조에 달합니다. 예술적 표현이나 새로운 학습을 시작하세요." },
            { name: "Hoʻoponopono", meaning: "의사소통 (Communication)", message: "갈등 해소와 관계 회복을 위해 솔직하고 열린 마음으로 대화하세요. 용서가 핵심입니다." },
            { name: "Hulu", meaning: "환상들 (Illusions)", message: "당신이 보고 있는 것이 현실이 아닐 수 있습니다. 환상에서 벗어나 진실을 찾으려 노력하세요." },
            { name: "Nalu", meaning: "사색 (Contemplation)", message: "파도처럼 밀려오는 생각들을 관찰하며 조용히 사색하는 시간이 필요합니다. 내면의 평화를 찾으세요." },
            { name: "Māmalāhoe", meaning: "연민 (Compassion)", message: "타인의 고통을 이해하고 공감하는 마음을 가지세요. 당신의 연민이 주변을 치유합니다." },
            { name: "Poliʻahu", meaning: "다독임 (Caress)", message: "지친 자신을 부드럽게 보듬고 휴식을 주세요. 스스로에게 친절해지는 것이 중요합니다." },
            { name: "Moʻo", meaning: "함정들 (Traps)", message: "당신의 앞길에 숨겨진 함정이나 장애물이 있을 수 있습니다. 모든 것을 주의 깊게 살펴보고 신중하게 행동하세요." },
            { name: "Puʻolo", meaning: "내어맡김 (Release)", message: "붙잡고 있는 것을 놓아주세요. 통제하려는 욕심을 버리고 우주의 계획에 자신을 내어맡기세요." },
            { name: "Puhi", meaning: "혼란 (Disruption)", message: "예상치 못한 사건이 발생하여 일상이 흔들릴 수 있습니다. 이 혼란이 변화의 씨앗임을 기억하세요." },
            { name: "Haumea", meaning: "지속성 (Sustenance)", message: "당신의 영적, 육체적, 재정적 안정을 위한 장기적인 계획을 세우세요. 지속 가능한 성장이 중요합니다." },
            { name: "Waʻa", meaning: "이동 (Transition)", message: "인생의 한 단계에서 다음 단계로 이동하는 과도기입니다. 변화를 두려워하지 말고 앞으로 나아가세요." },
            { name: "Pua", meaning: "발전 (Advance)", message: "꽃이 피어나듯, 당신의 계획과 프로젝트가 눈부시게 발전할 것입니다. 자신 있게 전진하세요." },
            { name: "Māui", meaning: "말썽꾼 (Trickster)", message: "예기치 않은 사건이 당신의 관점을 뒤흔들 것입니다. 장난기 있는 상황에서 교훈을 찾으세요." },
            { name: "Pōhaku", meaning: "관계들 (Relations)", message: "당신 주변의 인간관계를 소중히 하세요. 견고한 바위처럼 굳건한 관계가 당신의 힘이 됩니다." },
            { name: "Naupaka", meaning: "거리두기 (Detachment)", message: "감정적으로 거리를 두고 객관적인 시각을 가질 때입니다. 집착을 놓아주세요." },
            { name: "Papa and Wākea", meaning: "고군분투/일체성 (Struggle/Wholeness)", message: "고군분투 속에서 진정한 일체성을 발견합니다. 이원성을 넘어선 전체를 보세요." },
            { name: "Lehua", meaning: "입문 (Initiation)", message: "새로운 지식이나 영적 경험으로의 입문 단계에 있습니다. 두려움을 버리고 새로운 길을 시작하세요." },
            { name: "Kāne", meaning: "창조 (Creation)", message: "당신의 창조적인 에너지가 넘쳐흐릅니다. 새로운 아이디어를 현실화하는 데 집중하세요." },
            { name: "Hina", meaning: "양육하기 (Nurturing)", message: "자신과 타인을 돌보고 양육하는 데 집중하세요. 부드러움과 보살핌이 필요한 시기입니다." },
            { name: "Anuenue", meaning: "변형 (Transformation)", message: "무지개처럼 아름다운 변형이 일어날 것입니다. 힘든 시간을 통과하면 보상이 기다리고 있습니다." },
            { name: "Lei", meaning: "소중히 여기다 (Cherish)", message: "당신의 삶에서 아름답고 소중한 것들을 축복하고 감사하세요. 현재의 순간을 소중히 간직하세요." },
            { name: "ʻAnoʻano", meaning: "의도 (Intention)", message: "당신의 의도와 소망을 우주에 분명히 선언하세요. 명확한 의도가 현실을 만듭니다." }
        ];

        // --- 3. 화면 전환 함수 ---
        function openDetail(key) {
            const home = document.getElementById('homeView');
            const detail = document.getElementById('detailView');
            const title = document.getElementById('detailTitle');
            const content = document.getElementById('detailContent');

            // 화면 전환
            home.style.display = 'none';
            detail.style.display = 'block';

            // 데이터 채우기
            if (contentData[key]) {
                title.innerText = contentData[key].title;
                content.innerHTML = contentData[key].html;
            }

            // 의상 페이지일 경우 링크 리스트 렌더링 실행
            if (key === 'costumes') {
                renderLinks();
            }
        }

        function goHome() {
            document.getElementById('homeView').style.display = 'grid';
            document.getElementById('detailView').style.display = 'none';
        }

        // --- 4. 멜레 모달 기능 ---
        function showLyrics(songKey) {
            const data = lyricsData[songKey];
            if (!data) return;
            document.getElementById('modalSongTitle').innerText = data.title;
            document.getElementById('modalSongSub').innerText = data.sub;
            // 줄바꿈을 HTML 태그로 변환
            document.getElementById('modalLyrics').innerHTML = data.text.replace(/\n/g, '<br>'); 
            document.getElementById('meleModal').style.display = 'block';
        }

        function closeMeleModal() {
            document.getElementById('meleModal').style.display = 'none';
        }
        
        window.onclick = function(e) {
            const modal = document.getElementById('meleModal');
            if (e.target == modal) {
                modal.style.display = 'none';
            }
        }

        // --- 5. 링크 관리 기능 (LocalStorage) ---
        function getLinks() { return JSON.parse(localStorage.getItem('hulaLinks') || '[]'); }
        function saveLinks(list) { localStorage.setItem('hulaLinks', JSON.stringify(list)); }

        function renderLinks() {
            const area = document.getElementById('linkListArea');
            if (!area) return;
            area.innerHTML = '';
            const list = getLinks();
            
            if(list.length === 0) {
                area.innerHTML = '<p style="color:#999; text-align:center;">저장된 링크가 없습니다. URL을 추가해보세요.</p>';
                return;
            }

            list.forEach((url, idx) => {
                const div = document.createElement('div');
                div.className = 'link-item';
                div.innerHTML = `
                    <a href="${url}" target="_blank">${url}</a>
                    <span class="material-icons" style="color:#EF6356; cursor:pointer;" onclick="removeLink(${idx})">delete</span>
                `;
                area.appendChild(div);
            });
        }

        function addLink() {
            const input = document.getElementById('linkInput');
            const url = input.value.trim();
            if (!url) return alert('URL을 입력해주세요.');
            
            const list = getLinks();
            list.push(url);
            saveLinks(list);
            input.value = '';
            renderLinks();
        }

        function removeLink(idx) {
            const list = getLinks();
            list.splice(idx, 1);
            saveLinks(list);
            renderLinks();
        }

        // --- 6. 마나 카드 뽑기 게임 함수 (44장 배열 사용) ---
        function drawCard(element) {
            // 한 번만 뽑을 수 있도록 설정
            if (element.onclick === null) return;
            
            element.style.transform = "rotateY(180deg)";
            
            setTimeout(() => {
                // 확장된 manaCardsData 배열을 사용
                const randomIndex = Math.floor(Math.random() * manaCardsData.length);
                const drawnCard = manaCardsData[randomIndex];
                
                const resultBox = document.getElementById('cardResult');
                resultBox.innerHTML = `
                    <div class="card-name">${drawnCard.name} (${drawnCard.meaning})</div>
                    <hr style="border:0; border-top: 1px dashed #ccc; margin: 10px 0;">
                    <div class="card-message" style="font-weight:bold;">✨ 오늘의 메시지: ${drawnCard.message}</div>
                `;
                
                element.innerText = "✨"; // 카드 뒷면을 마나 아이콘으로 변경
                element.style.background = "#FF7F50"; // 오렌지색으로 변경
            }, 300);
            
            // 다시 뽑지 못하도록 버튼 비활성화
            element.onclick = null;
            element.style.cursor = 'default';
        }
        
        // 초기 로드 시 Home 페이지 활성화
        goHome();
    </script>
