<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hula Academy Mana Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* --- 기본 테마 설정 (기존과 동일) --- */
        :root {
            --color-header: #EF6356;
            --color-orange: #F49E4C;
            --color-teal-dark: #168087;
            --color-teal-light: #2CBEB0;
            --color-green: #70A557;
            --bg-color: #F8F5E8;
            --text-dark: #333333;
            --text-white: #FFFFFF;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        /* --- 헤더 --- */
        .header-banner {
            background-color: var(--color-header);
            color: var(--text-white);
            padding: 20px;
            border-radius: 0 0 25px 25px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(239, 99, 86, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-banner h1 { margin: 0; font-size: 24px; font-weight: 700; }

        /* --- 메인 그리드 (홈) --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .card {
            border-radius: 20px;
            padding: 20px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            color: white;
        }
        .card:active { transform: scale(0.98); }
        .card .material-icons { font-size: 50px; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
        .card p { margin: 5px 0 0 0; font-size: 11px; opacity: 0.9; }

        /* 컬러 클래스 */
        .bg-orange { background-color: var(--color-orange); }
        .bg-teal-dark { background-color: var(--color-teal-dark); }
        .bg-teal-light { background-color: var(--color-teal-light); }
        .bg-green { background-color: var(--color-green); }

        /* 하단 우측 분할 */
        .small-cards-wrapper { display: flex; gap: 15px; }
        .small-card { flex: 1; height: 150px; border-radius: 20px; background-color: var(--color-teal-dark); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .small-card .material-icons { font-size: 36px; margin-bottom: 8px; }
        .small-card h3 { font-size: 13px; margin: 0; }

        /* --- 상세 페이지 (Detail View) --- */
        .detail-page {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s;
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #555; margin-right: 10px;
        }
        .detail-title { font-size: 22px; font-weight: bold; color: var(--color-teal-dark); }
        
        /* 상세 내용 스타일 */
        .content-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); line-height: 1.6; }
        .content-box h3 { color: var(--color-orange); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 20px; }
        .content-box h3:first-child { margin-top: 0; }
        .content-box ul { padding-left: 20px; margin-top: 10px;}
        .content-box li { margin-bottom: 8px; }
        .content-box strong { color: var(--color-teal-dark); }

        /* 카드 뽑기 스타일 */
        .card-game-box { text-align: center; padding: 20px; }
        .game-card { width: 150px; height: 220px; background: var(--color-teal-dark); border-radius: 10px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; cursor: pointer; transition: transform 0.5s; backface-visibility: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .game-result { min-height: 70px; padding: 10px; background: #FFF3E0; border-radius: 10px; border: 1px dashed var(--color-orange); }
        .card-name { font-size: 20px; font-weight: bold; color: var(--color-header); margin-bottom: 5px; }
        .card-message { font-size: 14px; color: #555; }

        /* --- 모달 (팝업) 및 하단 네비게이션 (기존과 동일) --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 15% auto; padding: 24px; border-radius: 20px; width: 85%; max-width: 400px; }
        .close-button { float: right; font-size: 28px; cursor: pointer; color: #aaa; }
        .lyrics-box { background: #f5f5f5; padding: 15px; border-radius: 10px; white-space: pre-wrap; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        .lyrics-box h4 { color: var(--color-teal-dark); margin: 5px 0 5px 0; font-size: 15px; }
        .lyrics-box p { margin: 0 0 10px 0; }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: white; border-radius: 30px; padding: 10px 20px; display: flex; justify-content: space-between; box-shadow: 0 5px 20px rgba(0,0,0,0.1); z-index: 100; }
        .nav-btn { background: none; border: none; color: #999; display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
        .nav-btn.active { color: var(--color-teal-dark); }
        .nav-btn .material-icons { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header-banner">
        <span class="material-icons">local_florist</span>
        <h1>Hula Academy</h1>
    </div>

    <div id="homeView" class="grid-container">
        
        <div class="card bg-orange" onclick="openDetail('history')">
            <span class="material-icons">people_alt</span>
            <h3>Hula History</h3>
            <p>역사와 기원</p>
        </div>

        <div class="card bg-teal-dark" onclick="openDetail('lessons')">
            <span class="material-icons">directions_run</span>
            <h3>Dance Lessons</h3>
            <p>기초 동작 배우기</p>
        </div>

        <div class="card bg-teal-light" onclick="openDetail('mele')">
            <span class="material-icons">music_note</span>
            <h3>Mele Songs</h3>
            <p>노래와 가사 해석</p>
        </div>

        <div class="card bg-orange" onclick="openDetail('costumes')">
            <span class="material-icons">checkroom</span>
            <h3>Costumes</h3>
            <p>의상 정보 & 링크</p>
        </div>

        <div class="card bg-green" onclick="openDetail('spirit')">
            <span class="material-icons">spa</span>
            <h3>Hawaiian Spirit</h3>
            <p>알로하 정신</p>
        </div>

        <div class="small-cards-wrapper">
            <div class="small-card" onclick="openDetail('cards')">
                <span class="material-icons">style</span>
                <h3>Mana Card<br>Pick</h3>
            </div>
            <div class="small-card" onclick="window.open('https://www.youtube.com/results?search_query=hula+dance+lesson', '_blank')">
                <span class="material-icons">play_circle_filled</span>
                <h3>YouTube<br>Class</h3>
            </div>
        </div>

    </div>

    <div id="detailView" class="detail-page">
        <div class="detail-header">
            <button class="back-btn" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </button>
            <span id="detailTitle" class="detail-title">Title</span>
        </div>
        <div id="detailContent" class="content-box">
            </div>
    </div>

    <div id="meleModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeMeleModal()">&times;</span>
            <h2 id="modalSongTitle" style="color:var(--color-teal-dark); margin:0;"></h2>
            <p id="modalSongSub" style="color:#666; font-size:14px; margin-top:5px;"></p>
            <div id="modalLyrics" class="lyrics-box"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="goHome()">
            <span class="material-icons">home</span>Home
        </button>
        <button class="nav-btn" onclick="openDetail('lessons')">
            <span class="material-icons">school</span>Learn
        </button>
        <button class="nav-btn" onclick="openDetail('costumes')">
            <span class="material-icons">shopping_bag</span>Shop
        </button>
    </div>

        // --- 3. 화면 전환 함수 ---
        function openDetail(key) {
            const home = document.getElementById('homeView');
            const detail = document.getElementById('detailView');
            const title = document.getElementById('detailTitle');
            const content = document.getElementById('detailContent');

            // 화면 전환
            home.style.display = 'none';
            detail.style.display = 'block';

            // 데이터 채우기
            if (contentData[key]) {
                title.innerText = contentData[key].title;
                content.innerHTML = contentData[key].html;
            }

            // 의상 페이지일 경우 링크 리스트 렌더링 실행
            if (key === 'costumes') {
                renderLinks();
            }
        }

        function goHome() {
            document.getElementById('homeView').style.display = 'grid';
            document.getElementById('detailView').style.display = 'none';
        }

        // --- 4. 멜레 모달 기능 ---
        function showLyrics(songKey) {
            const data = lyricsData[songKey];
            if (!data) return;
            document.getElementById('modalSongTitle').innerText = data.title;
            document.getElementById('modalSongSub').innerText = data.sub;
            document.getElementById('modalLyrics').innerHTML = data.text.replace(/\n/g, '<br>');
            document.getElementById('meleModal').style.display = 'block';
        }

        function closeMeleModal() {
            document.getElementById('meleModal').style.display = 'none';
        }
        
        window.onclick = function(e) {
            const modal = document.getElementById('meleModal');
            if (e.target == modal) {
                modal.style.display = 'none';
            }
        }

        // --- 5. 링크 관리 기능 (LocalStorage) ---
        function getLinks() { return JSON.parse(localStorage.getItem('hulaLinks') || '[]'); }
        function saveLinks(list) { localStorage.setItem('hulaLinks', JSON.stringify(list)); }

        function renderLinks() {
            const area = document.getElementById('linkListArea');
            if (!area) return;
            area.innerHTML = '';
            const list = getLinks();
            
            if(list.length === 0) {
                area.innerHTML = '<p style="color:#999; text-align:center;">저장된 링크가 없습니다. URL을 추가해보세요.</p>';
                return;
            }

            list.forEach((url, idx) => {
                const div = document.createElement('div');
                div.className = 'link-item';
                div.innerHTML = `
                    <a href="${url}" target="_blank">${url}</a>
                    <span class="material-icons" style="color:#EF6356; cursor:pointer;" onclick="removeLink(${idx})">delete</span>
                `;
                area.appendChild(div);
            });
        }

        function addLink() {
            const input = document.getElementById('linkInput');
            const url = input.value.trim();
            if (!url) return alert('URL을 입력해주세요.');
            
            const list = getLinks();
            list.push(url);
            saveLinks(list);
            input.value = '';
            renderLinks();
        }

        function removeLink(idx) {
            const list = getLinks();
            list.splice(idx, 1);
            saveLinks(list);
            renderLinks();
        }

        // --- 6. 마나 카드 뽑기 게임 ---
        function drawCard(element) {
            // 한 번만 뽑을 수 있도록 설정
            if (element.onclick === null) return;
            
            element.style.transform = "rotateY(180deg)";
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * manaCardsData.length);
                const drawnCard = manaCardsData[randomIndex];
                
                const resultBox = document.getElementById('cardResult');
                resultBox.innerHTML = `
                    <div class="card-name">${drawnCard.name}</div>
                    <div class="card-message">${drawnCard.description}</div>
                    <hr style="border:0; border-top: 1px dashed #ccc; margin: 10px 0;">
                    <div class="card-message" style="font-weight:bold;">✨ 오늘의 메시지: ${drawnCard.message}</div>
                `;
                
                element.innerText = "✨"; // 카드 뒷면을 마나 아이콘으로 변경
                element.style.background = "#FF7F50"; // 오렌지색으로 변경
            }, 300);
            
            // 다시 뽑지 못하도록 버튼 비활성화
            element.onclick = null;
            element.style.cursor = 'default';
        }
        
        // 초기 로드 시 Home 페이지 활성화
        goHome();
    </script>
